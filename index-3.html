<head>

*{box-sizing:border-box}body{margin:0;background:#080705;color:#eee;font-family:Arial,sans-serif}
header{padding:18px 12px;text-align:center;background:linear-gradient(145deg,#251607,#080705);border-bottom:1px solid #8b6a25}
h1{margin:0 0 6px;color:#e8c86a;font-size:23px}.sub{color:#bbb;font-size:13px}
.wrap{max-width:1200px;margin:auto;padding:10px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #765b24;background:#15110c;color:#fff;font-size:14px}
button{cursor:pointer}.gold{border-color:#c69b36;color:#f1d477}
.actionsTop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
#map{height:52vh;min-height:360px;border:1px solid #725823;border-radius:14px;overflow:hidden}
.status{padding:9px 2px;color:#d7c58c;font-size:13px}.count{color:#e7c45d;font-weight:bold}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-top:10px}
.card{background:#11100d;border:1px solid #40351f;border-radius:13px;padding:13px}.name{font-size:17px;color:#f1d477;font-weight:bold;margin-bottom:7px}
.meta,.gps{font-size:12px;color:#aaa;margin:4px 0}.gps{font-family:monospace;color:#d8d1bd}
.cardActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.cardActions a,.cardActions button,.modal a{display:block;text-align:center;text-decoration:none;padding:9px;border-radius:9px;border:1px solid #6d5627;background:#17120b;color:#f0d47b;font-size:12px}
.empty{padding:25px;text-align:center;color:#aaa}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}.box{max-width:520px;width:100%;background:#11100d;border:1px solid #9a762c;border-radius:15px;padding:18px}
.box h2{color:#e8c86a;margin-top:0}.modal a{margin-top:8px}.close{float:right;width:auto;padding:7px 10px}
.note{font-size:11px;color:#999;margin-top:10px;line-height:1.4}
@media(max-width:700px){.controls{grid-template-columns:1fr}.actionsTop{grid-template-columns:1fr 1fr}#map{height:48vh;min-height:320px}}
</style>
</head>

<header>
<h1>⛪ Македонски цркви и манастири</h1>
<div class="sub">Една HTML страница • GPS • Google Maps • OpenStreetMap</div>
</header>
<div class="wrap">
<div class="controls">

<select id="type"><option value="all">Сите објекти</option><option value="monastery">☦ Манастири</option><option value="church">✝ Цркви</option></select>
<select id="region"><option value="all">Сите региони</option></select>
</div>
<div class="actionsTop">
<button class="gold" onclick="showAll()">🗺 Сите на карта</button>
<button onclick="useMyLocation()">📍 Моја локација</button>
<button onclick="nearest()">🎯 Најблиски</button>
<button onclick="resetFilters()">↺ Ресет</button>
</div>
<div class="status"><span id="count" class="count">145 записи</span> • <span id="status">Податоците се вградени директно во HTML — нема fetch/GIS зависност.</span></div>
<div id="map"></div><div id="list" class="list"></div>
<div class="note">GPS координатите се координати внесени во регистарот. За патување проверете ја точната позиција на Google Maps/OSM пред поаѓање.</div>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeDetail()">
<div class="box"><button class="close" onclick="closeDetail()">✕</button><div id="detail"></div></div>
</div>

function mapsURL(x){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.lat+','+x.lon);}
function osmURL(x){return 'https://www.openstreetmap.org/?mlat='+x.lat+'&mlon='+x.lon+'#map=17/'+x.lat+'/'+x.lon;}
function popup(x){return `<b>${esc(x.name)}</b><br>${x.type==='monastery'?'☦ Манастир':'✝ Црква'} • ${esc(x.region)}<br><code>${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}</code><br><br><a target="_blank" rel="noopener" href="${mapsURL(x)}">📍 Google Maps</a> &nbsp; <a target="_blank" rel="noopener" href="${osmURL(x)}">🗺 OSM</a>`;}
function filtered(){
 const q=$('search').value.trim().toLowerCase(),ty=$('type').value,rg=$('region').value;
 let rows=all.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.region.toLowerCase().includes(q))&&(ty==='all'||x.type===ty)&&(rg==='all'||x.region===rg));
 if(nearMode&&window._userPos)rows.sort((a,b)=>distance(window._userPos.lat,window._userPos.lon,a.lat,a.lon)-distance(window._userPos.lat,window._userPos.lon,b.lat,b.lon));
 return rows;
}
function distance(a,b,c,d){const R=6371,rad=Math.PI/180,da=(c-a)*rad,db=(d-b)*rad;const q=Math.sin(da/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q));}
function render(){
 const rows=filtered();markers.forEach(m=>map.removeLayer(m));markers=[];
 rows.forEach(x=>{const mm=L.marker([x.lat,x.lon]).addTo(map).bindPopup(popup(x));mm._churchId=x.id;markers.push(mm);});
 $('count').textContent=rows.length+' записи';
 $('list').innerHTML=rows.map(x=>`<article class="card">

}
function focusLocation(x){map.setView([x.lat,x.lon],17,{animate:true});const mm=markers.find(z=>z._churchId===x.id);if(mm)setTimeout(()=>mm.openPopup(),200);$('status').textContent='Локација: '+x.name+' • '+x.lat.toFixed(6)+', '+x.lon.toFixed(6);}
function openDetail(id){const x=all.find(y=>y.id===id);if(!x)return;window._detailX=x;$('detail').innerHTML=`<h2>${esc(x.name)}</h2><p><b>Тип:</b> ${x.type==='monastery'?'☦ Манастир':'✝ Црква'}<br><b>Место:</b> ${esc(x.region)}<br><b>GPS:</b> ${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}</p><a target="_blank" rel="noopener" href="${mapsURL(x)}">📍 Отвори точна GPS локација во Google Maps</a><a target="_blank" rel="noopener" href="${osmURL(x)}">🗺 Отвори на OpenStreetMap</a><a href="#" onclick="copyGPS(${x.lat},${x.lon});return false">⧉ Копирај GPS</a><a href="#" onclick="focusLocation(window._detailX);closeDetail();return false">🗺 Покажи на карта</a>`;$('modal').classList.add('open');}
function closeDetail(){$('modal').classList.remove('open');}
function copyGPS(lat,lon){const t=lat.toFixed(6)+', '+lon.toFixed(6);if(navigator.clipboard)navigator.clipboard.writeText(t);$('status').textContent='GPS копирано: '+t;}
function showAll(){nearMode=false;render();if(markers.length){const g=L.featureGroup(markers);map.fitBounds(g.getBounds().pad(0.08));}}
function resetFilters(){nearMode=false;$('search').value='';$('type').value='all';$('region').value='all';showAll();$('status').textContent='Филтрите се ресетирани.';}
function useMyLocation(){if(!navigator.geolocation){$('status').textContent='GPS не е достапен на овој уред.';return;}navigator.geolocation.getCurrentPosition(p=>{window._userPos={lat:p.coords.latitude,lon:p.coords.longitude};if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('📍 Моја локација');map.setView([p.coords.latitude,p.coords.longitude],12);$('status').textContent='Моја локација: '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);},()=>$('status').textContent='Не можам да ја добијам локацијата. Провери дозвола за GPS.');}
function nearest(){if(!window._userPos){useMyLocation();setTimeout(()=>{nearMode=true;render();},1200);return;}nearMode=true;render();$('status').textContent='Подредено од најблиските локации.';}
function loadRegions(){[...new Set(all.map(x=>x.region))].sort((a,b)=>a.localeCompare(b,'mk')).forEach(r=>$('region').insertAdjacentHTML('beforeend',`<option value="${esc(r)}">${esc(r)}</option>`));}
$('search').addEventListener('input',()=>{nearMode=false;render();});
$('type').addEventListener('change',()=>{nearMode=false;render();});
$('region').addEventListener('change',()=>{nearMode=false;render();});
loadRegions();render();
</script>
</body>
</html>
