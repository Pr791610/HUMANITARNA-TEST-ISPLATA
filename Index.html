<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Македонски цркви и манастири</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080705;
 color:#eee;
 font-family:Arial,sans-serif
}
header{
 text-align:center;
 padding:18px 10px;
 background:linear-gradient(145deg,#211507,#080705);
 border-bottom:1px solid #8f6b27
}
.orn{color:#d8b45a;font-size:20px}
h1{
 margin:6px 0;
 color:#e2bd65;
 font-size:23px
}
.sub{
 color:#a99572;
 font-size:12px
}
.wrap{
 max-width:1400px;
 margin:auto;
 padding:10px
}
.toolbar{
 background:#120e09;
 border:1px solid #4d3919;
 border-radius:12px;
 padding:10px;
 margin-bottom:10px
}
.grid{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:8px
}
input,select,button{
 width:100%;
 min-height:44px;
 border-radius:8px;
 border:1px solid #634a20;
 background:#0b0907;
 color:#e8d29b;
 padding:8px 10px;
 font-size:14px
}
button{
 cursor:pointer
}
button:hover{
 background:#24190c
}
.buttons{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-top:8px
}
#map{
 width:100%;
 height:55vh;
 min-height:400px;
 border:1px solid #765521;
 border-radius:12px;
 overflow:hidden
}
.stats{
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:8px;
 padding:10px 2px;
 color:#bca779;
 font-size:13px
}
.list{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-top:10px
}
.card{
 position:relative;
 background:linear-gradient(145deg,#1b1208,#0d0b08);
 border:1px solid #463519;
 border-radius:12px;
 padding:13px;
 box-shadow:0 5px 20px #0008
}
.card:hover{
 border-color:#b18a3c;
 transform:translateY(-1px)
}
.name{
 color:#e2bd65;
 font-weight:bold;
 font-size:16px;
 padding-right:30px;
 line-height:1.35
}
.meta{
 color:#b5a27e;
 margin-top:6px;
 font-size:13px
}
.gps{
 color:#d4b66b;
 font-family:monospace;
 font-size:12px;
 margin-top:7px
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr 42px;
 gap:6px;
 margin-top:10px
}
.actions a,.actions button{
 display:flex;
 justify-content:center;
 align-items:center;
 text-decoration:none;
 min-height:38px;
 border:1px solid #62491e;
 border-radius:7px;
 color:#e4c36e;
 background:#0b0907;
 font-size:12px
}
.fav{
 position:absolute;
 right:9px;
 top:9px;
 width:34px;
 min-height:34px;
 padding:0;
 color:#cba552
}
.empty{
 text-align:center;
 padding:30px;
 color:#a89570
}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
 background:#171008;
 color:#eee;
 border:1px solid #806029
}
.popup-title{
 color:#e3bf68;
 font-weight:bold;
 font-size:15px;
 margin-bottom:5px
}
.popup-links a{
 color:#e4c36e;
 margin-right:8px
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:9999;
 background:#000c;
 align-items:center;
 justify-content:center;
 padding:15px
}
.modal.open{display:flex}
.dialog{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:linear-gradient(145deg,#241609,#0d0a07);
 border:1px solid #a37b2d;
 border-radius:14px;
 padding:18px;
 box-shadow:0 20px 70px #000
}
.close{
 float:right;
 width:auto;
 padding:5px 12px
}
.detail h2{
 color:#e2bd65
}
.biggps{
 font-family:monospace;
 color:#d8b45a;
 margin:10px 0
}
.detail a{
 display:block;
 margin:7px 0;
 padding:10px;
 border:1px solid #62491e;
 border-radius:8px;
 color:#e4c36e;
 text-decoration:none
}
footer{
 text-align:center;
 color:#75664d;
 padding:25px 10px
}
@media(max-width:800px){
 .grid{grid-template-columns:1fr}
 .buttons{grid-template-columns:1fr 1fr}
 .list{grid-template-columns:1fr}
 #map{height:52vh;min-height:350px}
}
</style>
</head>

<header>
<div class="orn">✦ ☦ ✦</div>
<h1>ЦРКВИ • МАНАСТИРИ • ЦРКОВНИ ОБЈЕКТИ</h1>

</header>

<main class="wrap">

<section class="toolbar">

<div class="grid">

<input id="search"
placeholder="🔎 Пребарај име, место или објект..."

<select id="type">
<option value="all">Сите објекти</option>
<option value="monastery">☦ Манастири</option>
<option value="church">✝ Цркви</option>
</select>

<select id="region">
<option value="all">Сите места</option>
</select>

</div>

<div class="buttons">
<button onclick="showAll()">🗺 Сите на карта</button>
<button onclick="resetMap()">↺ Ресет</button>
<button onclick="myLocation()">📍 Моја локација</button>
<button onclick="nearest()">🧭 Најблиски</button>
</div>

</section>

<div class="stats">
<span id="count">0 записи</span>
<span id="source">INDEX 002</span>
<span id="status">Подготвено</span>
</div>

<div id="map"></div>

<div id="list" class="list"></div>

</main>

<div id="modal" class="modal">
<div class="dialog">
<button class="close" onclick="closeDetail()">✕</button>
<div id="detail"></div>
</div>
</div>

<footer>
☦ Македонски цркви и манастири •

function esc(s){

 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',

}

/* =========================================================
   SELECT / OPEN LOCATION
   ========================================================= */

function focusLocation(x){

 map.setView([x.lat,x.lon],17,{
  animate:true
 });

 const m=markers.find(z=>z._churchId===x.id);

 if(m){
  setTimeout(()=>m.openPopup(),250);
 }

 $('status').textContent=
 'Локација: '+x.name+
 ' • '+x.lat.toFixed(6)+', '+x.lon.toFixed(6);

 window.scrollTo({
  top:document.getElementById('map').offsetTop-10,
  behavior:'smooth'
 });
}

function openDetail(id){

 const x=all.find(y=>y.id===id);
 if(!x)return;

 $('detail').innerHTML=`
 <h2>${esc(x.name)}</h2>

 <p>
 <b>Тип:</b>
 ${x.type==='monastery'?'☦ Манастир':'✝ Црква'}
 <br>
 <b>Место:</b> ${esc(x.region)}
 </p>

 <div class="biggps">
 GPS: ${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}
 </div>

 <a target="_blank" rel="noopener"
 href="${mapsURL(x)}">
 📍 Отвори точна GPS локација во Google Maps
 </a>

 <a target="_blank" rel="noopener"
 href="${osmURL(x)}">
 🗺 Отвори на OpenStreetMap
 </a>

 <a href="#"
 onclick="copyGPS(${x.lat},${x.lon});return false">
 ⧉ Копирај GPS координати
 </a>

 <a href="#"
 onclick="focusLocationById('${x.id}');closeDetail();return false">
 🗺 Покажи на главната карта
 </a>
 `;

 $('modal').classList.add('open');
}

function focusLocationById(id){
 const x=all.find(y=>y.id===id);
 if(x)focusLocation(x);
}

function closeDetail(){
 $('modal').classList.remove('open');
}

function copyGPS(lat,lon){

 const t=lat.toFixed(6)+', '+lon.toFixed(6);

 if(navigator.clipboard){
  navigator.clipboard.writeText(t)
  .then(()=>{$('status').textContent='GPS копирано: '+t})
  .catch(()=>prompt('Копирај GPS:',t));
 }else{
  prompt('Копирај GPS:',t);
 }
}

/* =========================================================
   FILTER
   ========================================================= */

function filtered(){

 const q=$('search').value.trim().toLowerCase();
 const ty=$('type').value;
 const rg=$('region').value;

 let rows=all.filter(x=>
  (!q ||
   x.name.toLowerCase().includes(q) ||
   x.region.toLowerCase().includes(q)
  ) &&
  (ty==='all'||x.type===ty) &&
  (rg==='all'||x.region===rg)
 );

 if(nearMode && window._userPos){
  rows.sort((a,b)=>
   distance(
    window._userPos.lat,
    window._userPos.lon,
    a.lat,a.lon
   )-
   distance(
    window._userPos.lat,
    window._userPos.lon,
    b.lat,b.lon
   )
  );
 }

 return rows;
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

 const rows=filtered();

 markers.forEach(m=>map.removeLayer(m));
 markers=[];

 rows.forEach(x=>{

  const m=L.marker([x.lat,x.lon])
   .addTo(map)
   .bindPopup(popup(x));

  m._churchId=x.id;

  m.on('click',()=>{
   $('status').textContent=
    x.name+' • '+x.lat.toFixed(6)+', '+x.lon.toFixed(6);
  });

  markers.push(m);
 });

 $('count').textContent=rows.length+' записи';

 $('list').innerHTML=rows.map(x=>`

 <article class="card">

 <button class="fav"
 onclick="focusLocationById('${x.id}')">
 📍
 </button>

 <div class="name">${esc(x.name)}</div>

 <div class="meta">
 ${x.type==='monastery'?'☦ Манастир':'✝ Црква'}
 • ${esc(x.region)}
 </div>

 <div class="gps">
 ${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}
 </div>

 <div class="actions">

 <a target="_blank"
 rel="noopener"
 href="${mapsURL(x)}">
 📍 Maps
 </a>

 <a href="#"
 onclick="openDetail('${x.id}');return false">
 ℹ Детали
 </a>

 <button
 onclick="copyGPS(${x.lat},${x.lon})">
 ⧉
 </button>

 </div>

 </article>

 `).join('') ||

 '<div class="empty">Нема пронајдени резултати.</div>';
}

/* =========================================================
   REGIONS
   ========================================================= */

function loadRegions(){

 const regions=[
  ...new Set(all.map(x=>x.region))
 ].sort((a,b)=>a.localeCompare(b,'mk'));

 regions.forEach(r=>{
  const o=document.createElement('option');
  o.value=r;
  o.textContent=r;
  $('region').appendChild(o);
 });
}

/* =========================================================
   ALL MAP
   ========================================================= */

function showAll(){

 nearMode=false;

 const rows=filtered();

 if(!rows.length)return;

 const bounds=L.latLngBounds(
  rows.map(x=>[x.lat,x.lon])
 );

 map.fitBounds(bounds,{
  padding:[30,30]
 });

 $('status').textContent=
  'Прикажани '+rows.length+' локации';
}

/* =========================================================
   RESET
   ========================================================= */

function resetMap(){

 $('search').value='';
 $('type').value='all';
 $('region').value='all';

 nearMode=false;

 map.setView([41.6086,21.7453],8);

 render();

 $('status').textContent='Карта ресетирана';
}

/* =========================================================
   USER LOCATION
   ========================================================= */

function myLocation(){

 if(!navigator.geolocation){
  $('status').textContent='GPS не е поддржан';
  return;
 }

 navigator.geolocation.getCurrentPosition(pos=>{

  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;

  if(userMarker)
   map.removeLayer(userMarker);

  userMarker=L.marker([lat,lon])
   .addTo(map)
   .bindPopup('📍 Твојата локација')
   .openPopup();

  map.setView([lat,lon],14);

  window._userPos={lat,lon};

  $('status').textContent=
   'Твоја локација: '+
   lat.toFixed(6)+', '+lon.toFixed(6);

 },()=>{
  $('status').textContent=
   'Не може да се добие локацијата';
 });
}

/* =========================================================
   DISTANCE
   ========================================================= */

function distance(lat1,lon1,lat2,lon2){

 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(lat1*Math.PI/180)*
  Math.cos(lat2*Math.PI/180)*
  Math.sin(dLon/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );
}

/* =========================================================
   NEAREST
   ========================================================= */

function nearest(){

 if(!window._userPos){

  $('status').textContent=
   'Прво притисни „Моја локација“';

  myLocation();

  return;
 }

 nearMode=true;

 render();

 const rows=filtered();

 if(rows.length){

  focusLocation(rows[0]);

  $('status').textContent=
   'Најблиско: '+rows[0].name+
   ' • '+
   distance(
    window._userPos.lat,
    window._userPos.lon,
    rows[0].lat,
    rows[0].lon
   ).toFixed(2)+' km';
 }
}

/* =========================================================
   SEARCH / FILTER EVENTS
   ========================================================= */

$('search').addEventListener('input',()=>{
 nearMode=false;
 render();
});

$('type').addEventListener('change',()=>{
 nearMode=false;
 render();
});

$('region').addEventListener('change',()=>{
 nearMode=false;
 render();
});

/* =========================================================
   START
   ========================================================= */

loadRegions();
render();
